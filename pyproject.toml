[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "almasi"
version = "0.2.5"
description = "Composable Python libraries, persistent objects and live shared state."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["yaspin"]

[project.scripts]
almasi = "almasi.__main__:main"

[project.urls]
Homepage = "https://wordwield.ai"
Source = "https://github.com/WordWield/almasi"
LinkedIn = "https://www.linkedin.com/in/podgorny/"

[tool.setuptools.packages.find]
include = ["almasi*"]
