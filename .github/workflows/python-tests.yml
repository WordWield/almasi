name: Loader Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WordWield/almasi.cli
          ref: 780253ef9e90824b261e0f24de6538890b1757de
          path: .ci/cli
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/almasi-*.whl
          python -m pip check
      - name: Test installed loader outside its source tree
        env:
          ALMASI_CLI_SOURCE: ${{ github.workspace }}/.ci/cli/cli.py
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests"
