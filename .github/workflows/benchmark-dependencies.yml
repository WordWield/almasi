name: Dependency preparation benchmark

on:
  push:
    branches: [benchmark-git-update]
    paths:
      - '.github/workflows/benchmark-dependencies.yml'
      - 'benchmarks/dependencies.py'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison executable
        run: python -m pip install uv
      - name: Measure dependency preparation
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          uv --version
          python benchmarks/dependencies.py
